name: 🤖 24H Betman & Sports API AutoSync Cloud Pipeline

on:
  schedule:
    - cron: '0 * * * *' # 매 1시간마다 베트맨 최신 경기 & 선발 오피셜 자동 수집
  workflow_dispatch: # 수동 즉시 실행 가능

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          npm ci

      - name: 5. Execute Betman & API-Sports Real-Time Data Build
        run: |
          node build_and_emit_ts_schedule.js

      - name: 6. Build Production Web Bundle
        run: |
          npm run build

      - name: 7. Deploy 24/7 to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
