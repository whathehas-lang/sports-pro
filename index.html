<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="스포츠모든것" />
    <link rel="manifest" href="/manifest.json" />
    <title>스포츠의 모든 것 v2 - 100% 오피셜 팩트 분석 플랫폼</title>
    <script>
      window.addEventListener('error', function(e) {
        var errDiv = document.getElementById('global-error-banner');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'global-error-banner';
          errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#991b1b;color:#ffffff;padding:16px;font-family:sans-serif;font-size:12px;word-break:break-all;box-shadow:0 10px 25px rgba(0,0,0,0.8);max-height:80vh;overflow-y:auto;';
          document.body ? document.body.appendChild(errDiv) : document.documentElement.appendChild(errDiv);
        }
        errDiv.innerHTML = '<strong style="font-size:14px;display:block;margin-bottom:8px;">🚨 [초기 렌더링 에러 발생]</strong>' +
          '<b>메시지:</b> ' + (e.message || (e.error && e.error.message) || e) + '<br/>' +
          '<b>파일:</b> ' + (e.filename || '') + ' (' + (e.lineno || '') + ':' + (e.colno || '') + ')<br/>' +
          (e.error && e.error.stack ? '<pre style="background:#450a0a;padding:8px;margin-top:8px;border-radius:6px;font-size:10px;white-space:pre-wrap;">' + e.error.stack + '</pre>' : '') +
          '<div style="margin-top:12px;display:flex;gap:8px;">' +
          '<button onclick="localStorage.clear();sessionStorage.clear();window.location.reload();" style="padding:8px 16px;background:#22c55e;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">캐시 전체 삭제 및 새로고침</button>' +
          '<button onclick="this.parentElement.parentElement.remove();" style="padding:8px 16px;background:#334155;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">닫기</button>' +
          '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled rejection:', e.reason);
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 overflow-x-hidden w-full max-w-full select-none">
    <div id="root" class="w-full overflow-x-hidden min-h-screen"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
